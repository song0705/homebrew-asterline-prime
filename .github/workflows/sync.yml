name: Sync latest release
on:
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-release
  cancel-in-progress: false
jobs:
  sync:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: Homebrew/actions/setup-homebrew@55301c8cac0982bc2fbeb71275fa0b71b963bdb1
      - run: python3 scripts/update.py
      - name: Detect update
        id: diff
        run: |
          if ! git diff --quiet -- Formula/asterline.rb; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate installation
        if: steps.diff.outputs.changed == 'true'
        run: |
          brew tap song0705/asterline-prime
          brew install --formula song0705/asterline-prime/asterline
          brew test song0705/asterline-prime/asterline
      - name: Commit verified formula
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/asterline.rb
          git commit -m 'Update Asterline Prime release'
          git push
